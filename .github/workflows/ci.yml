name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm exec playwright-core install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium chromium-headless-shell

      - name: Verify
        run: pnpm verify

      - name: Generated files are committed (skill copy, plugin and docs)
        run: git diff --exit-code -- packages/skill plugins .claude-plugin docs

      - name: Upload verify logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verify-logs-${{ matrix.os }}
          path: .tmp/verify/
          retention-days: 7

  # The minimum supported Node (package.json "engines"): build, then pack and run the CLI via npx.
  node-20:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20.19
          cache: pnpm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright-core install --with-deps chromium chromium-headless-shell
      - run: pnpm verify --only build,tarball
