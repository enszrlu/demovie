name: Pages

# Builds the website (site/) from the docs, the committed web media in site/media and site/data, and deploys it to
# GitHub Pages. The media is made locally with `pnpm site:media`; this workflow renders nothing.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "examples/**/video.json"
      - "examples/**/brief.md"
      - "examples/**/storyboard.md"
      - "packages/runtime/fonts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build the site
        run: pnpm site:build
        env:
          # the published URL (custom domains included), for canonical links, the sitemap and the 404 page
          SITE_URL: ${{ steps.pages.outputs.base_url }}/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
