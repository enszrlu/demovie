# Prepared for maintainers. Runs on pushes to main of the published repository, and only when the DEMOVIE_RELEASES
# repository variable is "enabled". The verify job has read-only permissions and no persisted credentials; the release
# job then opens the "Version packages" PR (changesets), and when that PR merges publishes `demovie` and
# `@demovie/runtime` to npm with provenance, creates the GitHub releases and moves the action's v0 tag.
# npm auth: trusted publishing (OIDC, no stored secret). Add this workflow (release.yml) as the trusted publisher of
# both packages on npmjs.com. Until a package exists there, or if you prefer a token, set the NPM_TOKEN secret to a
# granular access token; npm tries OIDC first and falls back to it. Needs the @demovie npm organization.
name: release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: read

jobs:
  verify:
    if: vars.DEMOVIE_RELEASES == 'enabled'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright-core install --with-deps chromium chromium-headless-shell
      - run: pnpm verify

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Trusted publishing needs npm >= 11.5.1 (pnpm 9 publishes through the npm CLI).
      - run: npm install --global npm@^11.5.1
      # changesets/action v2 works with @changesets/cli v3; a token, if any, reaches npm through setup-node's .npmrc.
      - id: changesets
        uses: changesets/action@v2.1.2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm changeset publish
          pr-title: Version packages
          commit-message: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
      # `demovie ci init` references enszrlu/demovie/packages/action@v0: keep v0 on the latest 0.x release.
      - name: Move the action's v0 tag
        if: steps.changesets.outputs.published == 'true'
        run: |
          git tag -f v0
          git push -f origin v0
